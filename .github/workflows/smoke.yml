name: smoke

# Spec section 7 (D27). ci.yml calls this workflow after each deploy with mode
# post-deploy: a failure fails that ci run, which sends GitHub's failed-workflow
# email, and the live hash check (REQ-DEPLOY-01) uploads the live-check artifact
# that the next report job records. The daily run (schedule, or started by hand)
# opens, updates or closes the one "Live site is failing" issue instead.
#
# Contract with ci.yml: every job sets its own timeout-minutes (a calling job
# cannot), every job name starts with "smoke" (ci.yml's live-check lookup matches
# that prefix), and the artifact is named live-check and holds live-check.json.

on:
  workflow_call:
    inputs:
      mode:
        description: post-deploy runs the live hash check; the daily run syncs the issue instead.
        type: string
        default: post-deploy
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Ruling P7: an explicit bash shell runs every step with -e and pipefail, so the
    # tests step fails when Playwright fails even though its output goes through tee.
    shell: bash

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      SMOKE_URL: ${{ vars.SITE_URL }}
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Refuse without the live site URL
        run: |
          if [ -z "$SMOKE_URL" ]; then
            echo "The repository variable SITE_URL is empty, so there is no live site to check." | tee smoke.log
            echo "::error::Set the repository variable SITE_URL to the live site's URL."
            exit 1
          fi
      - name: Smoke tests against the live site
        run: pnpm exec playwright test --project=smoke 2>&1 | tee -a smoke.log
        env:
          FORCE_COLOR: '0'
          PW_JSON: reports/playwright-smoke.json
      # Runs even when a smoke test failed, so the live hash result is always recorded.
      - name: Download the deployed manifest
        if: ${{ !cancelled() && inputs.mode == 'post-deploy' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: manifest-real, path: manifest }
      - name: Live file hashes (REQ-DEPLOY-01)
        if: ${{ !cancelled() && inputs.mode == 'post-deploy' }}
        run: pnpm tsx scripts/live-check.ts manifest/manifest.json "$SMOKE_URL" live-check.json "$COMMIT"
        env:
          COMMIT: ${{ github.sha }}
      # overwrite lets a rerun of this job upload again, like ci.yml's artifacts.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && inputs.mode == 'post-deploy' }}
        with: { name: live-check, path: live-check.json, if-no-files-found: error, overwrite: true }
      # Ruling P8: the label is created idempotently, so no manual setup is needed.
      - name: Daily issue (D27)
        if: ${{ always() && inputs.mode != 'post-deploy' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED: ${{ job.status != 'success' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create smoke-alert --force --color B60205 --description "The daily live site check is failing"
          {
            echo "Run: $RUN_URL"
            echo
            echo '```'
            if [ -s smoke.log ]; then tail -c 4000 smoke.log; else echo "No test output: the run failed before the smoke tests ran."; fi
            echo '```'
          } > smoke-details.md
          pnpm tsx scripts/issue-sync.ts smoke "$FAILED" smoke-details.md
