name: links-weekly

# Spec section 7 (D15): checks every external link on the live site, with 3 retries
# and backoff, and reports a link only after it fails on two consecutive weekly runs.
# It is its own workflow, so it never blocks a deploy. LinkedIn URLs are excluded.
#
# State between runs (ruling P9): while the "Broken external links" issue is open,
# its body holds the per link failure counts. With no issue open, the counts live in
# the link-state artifact, which every run uploads and the next run downloads from
# the newest completed run that has one. Not the Actions cache: it evicts entries
# unused for 7 days, exactly the weekly interval.

on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Ruling P7: bash runs every step with -e and pipefail.
    shell: bash

# Two overlapping runs would both read and write the same state.
concurrency:
  group: links-weekly
  cancel-in-progress: false

jobs:
  links:
    name: links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      # gh run list and gh run download read the previous run's link-state artifact.
      actions: read
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Refuse without the live site URL
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Set the repository variable SITE_URL to the live site's URL."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Ruling P8: the label is created idempotently, so no manual setup is needed.
      - name: Create the issue label
        run: gh label create link-alert --force --color D93F0B --description "External links failed two weekly checks in a row"
        env:
          # The token goes only to the steps that call gh, never to install scripts.
          GH_TOKEN: ${{ github.token }}
      - name: Previous link state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A missing state only means the counts start again from zero, so every
          # lookup that fails warns instead of failing the run.
          ids=$(gh run list --workflow links-weekly.yml --status completed --limit 5 --json databaseId -q '.[].databaseId') \
            || { echo "::warning::Could not list previous runs; link failure counts start from zero unless the issue holds them."; ids=; }
          for id in $ids; do
            if gh run download "$id" -n link-state -D state-in; then
              echo "Link state from run $id."
              break
            fi
          done
      - name: Check every external link, 3 retries with backoff (D15)
        # linkinator exits 1 when any link is broken; issue-sync judges the report.
        run: |
          pnpm exec linkinator "$SITE_URL" --recurse --format json \
            --skip 'linkedin\.com' --skip 'cloudflareinsights\.com' \
            --retry-errors --retry-errors-count 3 --retry-errors-jitter 3000 \
            --timeout 20000 > links.json || echo "linkinator exited with $?."
      - name: Update the issue
        run: pnpm tsx scripts/issue-sync.ts links links.json "$SITE_URL" state-in/link-state.json link-state.json
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with: { name: link-state, path: link-state.json, if-no-files-found: warn, overwrite: true }
