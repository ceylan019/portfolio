name: visual-baselines

# Spec section 7 (E23): regenerates the visual baselines inside the same Playwright
# container as ci.yml's fixture job, so no local Docker is needed. The baselines are
# uploaded as an artifact for review. This workflow never commits: after reviewing
# them, copy the files into tests/e2e/__screenshots__ and commit them by hand.

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      playwright: ${{ steps.v.outputs.playwright }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # E23: the container tag follows the exact @playwright/test pin, as in ci.yml.
      - id: v
        run: echo "playwright=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

  baselines:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.versions.outputs.playwright }}-noble
    env:
      # Ruling P18: same container settings as ci.yml's fixture job.
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:fixture
      - name: Serve the fixture build
        run: scripts/serve-and-wait.sh serve:fixture http://localhost:8787/
      # Visual baselines exist for desktop Chromium and emulated Pixel only (spec section 8).
      - name: Generate the baselines
        run: pnpm exec playwright test --grep @visual --project=chromium --project=pixel --update-snapshots
        env:
          CI: 'true'
          PW_JSON: reports/playwright-baselines.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: visual-baselines, path: tests/e2e/__screenshots__, if-no-files-found: error, overwrite: true }
